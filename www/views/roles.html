


<div class="h-full flex flex-col items-center py-10">
  <div class="w-full max-w-7xl bg-white shadow-md rounded-lg overflow-hidden">

    

   <!-- Barra de filtros -->
<div class="px-6 py-4 bg-white border-b border-gray-200 flex items-end justify-between">

    <!-- Botón Back -->
    <button
        id="btnBack"
        type="button"
        class="flex items-center gap-2 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition">

        <i class="fa-solid fa-arrow-left"></i>
            Back

    </button>

    <!-- Filtros -->
    <div class="flex flex-wrap items-end gap-4">

        <!-- Tipo de filtro -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Filter
            </label>

            <select
                id="filterType"
                class="w-56 rounded-md border border-gray-300 px-3 py-2 focus:border-indigo-500 focus:ring-indigo-500">

                <option value="">Select filter...</option>
                <option value="name">Name</option>
                <option value="id">ID</option>

            </select>
        </div>

        <!-- Roles -->
        <div id="nameFilterBox" class="hidden">

            <label class="block text-sm font-medium text-gray-700 mb-1">
                Role
            </label>

            <div
                id="roleFilter"
                class="w-60 max-h-40 overflow-y-auto rounded-md border border-gray-300 bg-white px-3 py-2">

            </div>

        </div>

        <!-- Orden -->
        <div id="idFilterBox" class="hidden">

            <label class="block text-sm font-medium text-gray-700 mb-1">
                Order
            </label>

            <select
                id="idSort"
                class="w-44 rounded-md border border-gray-300 px-3 py-2">

                <option value="ASC">Ascending</option>
                <option value="DESC">Descending</option>

            </select>

        </div>

        <!-- Limpiar filtros -->
        <button
            id="btnClearFilter"
            type="button"
            class="h-10 px-4 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">

            Clear Filters

        </button>

    </div>

</div>

<!-- Encabezado -->
<div class="px-6 py-4 bg-indigo-600 flex items-center justify-between">

    <h2 class="text-xl font-bold text-white">
        Roles List
    </h2>

    <div class="flex items-center gap-4 text-white">

        <!-- Eliminar -->
        <button
            id="btnRemove"
            type="button"
            class="hidden hover:text-gray-200 transition">

            <i class="fa-solid fa-trash text-lg"></i>

        </button>

        <!-- Editar -->
        <button
            id="btnEdit"
            type="button"
            class="hidden hover:text-gray-200 transition">

            <i class="fa-solid fa-pen-to-square text-lg"></i>

        </button>

        <!-- Agregar -->
        <button
            id="btnAdd"
            type="button"
            class="hover:text-gray-200 transition">

            <i class="fa-solid fa-circle-plus text-lg"></i>

        </button>

    </div>

</div>

    <!-- Tabla -->
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              ID
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Name
            </th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Description
            </th>
          </tr>
        </thead>

        <tbody
          id="rolesTableBody"
          class="bg-white divide-y divide-gray-200"
        ></tbody>
      </table>
    </div>
  </div>
</div>
