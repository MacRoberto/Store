<div class="h-full flex flex-col items-center py-10">
  <div class="w-full max-w-6xl bg-white shadow-md rounded-lg overflow-hidden">

    <!-- Filtros -->
    <div
      class="px-6 py-4 border-b border-gray-200 flex flex-wrap items-end justify-between gap-4"
    >
      <!-- Espacio vacío para empujar los filtros a la derecha -->
      <div></div>

      <!-- Controles -->
      <div class="flex flex-wrap items-end gap-3">

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Filter
          </label>

          <select
            id="filterType"
            class="border border-gray-300 rounded-md px-3 py-2 bg-white"
          >
            <option value="">Select filter...</option>
            <option value="name">Name</option>
            <option value="id">ID</option>
          </select>
        </div>

        <div id="nameFilterBox" class="hidden">
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Name
          </label>

          <div
            id="nameFilter"
            class="w-56 max-h-40 overflow-y-auto rounded-md border border-gray-300 bg-white px-3 py-2"
          ></div>
        </div>

        <div id="idFilterBox" class="hidden">
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Direction
          </label>

          <select
            id="orderDirection"
            class="border border-gray-300 rounded-md px-3 py-2 bg-white"
          >
            <option value="DESC">Descending</option>
            <option value="ASC">Ascending</option>
          </select>
        </div>

        <button
          id="btnClearFilters"
          class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition"
        >
          Clear Filters
        </button>

      </div>
    </div>

    <!-- Encabezado -->
    <div
      class="px-6 py-4 bg-indigo-600 border-b border-gray-200 flex items-center justify-between rounded-t-xl"
    >
      <h2 class="text-xl font-bold text-white">
        Roles List
      </h2>

      <div class="flex items-center gap-4">

        <!-- Regresar -->
        <button id="btnBack" class="block">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
              />
            </svg>
          </a>
        </button>

        <!-- Eliminar -->
        <button id="btnRemove" class="block hidden">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
              />
            </svg>
          </a>
        </button>

        <!-- Editar -->
        <button id="btnEdit" class="block hidden">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
              />
            </svg>
          </a>
        </button>

        <!-- Agregar -->
        <button id="btnAdd" class="block">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </a>
        </button>

      </div>
    </div>

    <!-- Tabla -->
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              ID
            </th>

            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Name
            </th>

            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Description
            </th>
          </tr>
        </thead>

        <tbody
          id="rolesTableBody"
          class="bg-white divide-y divide-gray-200"
        ></tbody>
      </table>
    </div>

  </div>
</div>
