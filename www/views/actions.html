<div class="h-full flex flex-col items-center py-10">
  <div class="w-full max-w-6xl bg-white shadow-md rounded-lg overflow-hidden">
    <div
      class="px-6 py-4 bg-indigo-600 border-b border-gray-200 flex items-center justify-between rounded-t-xl"
    >
      <h2 class="text-xl font-bold text-white">Access Control</h2>

      <div class="flex items-center gap-4">
        <button
          id="btnBackToModules"
          type="button"
          class="px-4 py-2 border border-white/40 text-white font-medium text-sm rounded-md shadow-sm hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/70 focus:ring-offset-2 focus:ring-offset-indigo-600"
        >
          <i class="fa-solid fa-arrow-left text-xs mr-2"></i>
          Back to Modules
        </button>
        <button id="btnRemove" class="block hidden">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
              />
            </svg>
          </a>
        </button>

        <button id="btnEdit" class="block hidden">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
              />
            </svg>
          </a>
        </button>

        <button id="btnAdd" class="block">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </a>
        </button>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              ID Action
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Action Name
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Destination Module
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Description
            </th>
          </tr>
        </thead>
        <tbody
          id="actionsTableBody"
          class="bg-white divide-y divide-gray-200"
        ></tbody>
      </table>
    </div>
  </div>

  <div
    id="actionModal"
    class="hidden fixed inset-0 z-50 overflow-y-auto bg-gray-600/50"
    aria-hidden="true"
  >
    <div class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-2xl rounded-lg bg-white shadow-xl">
        <div
          class="flex items-center justify-between border-b border-gray-200 px-6 py-4"
        >
          <h3 id="actionModalTitle" class="text-lg font-semibold text-gray-900">
            Add Action
          </h3>
          <button
            id="actionModalClose"
            type="button"
            class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="itemForm" method="POST" class="p-6 grid grid-cols-1 gap-4">
          <input type="hidden" name="id_action" value="" />

          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1"
              >Action Name</label
            >
            <input
              type="text"
              name="name"
              placeholder="Delete Product"
              required
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1"
              >Description</label
            >
            <input
              type="text"
              name="description"
              placeholder="Allows deleting records"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div class="flex justify-end gap-3 border-t border-gray-100 pt-4">
            <button
              type="button"
              id="actionModalCancel"
              class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50"
            >
              Cancel
            </button>
            <button
              id="actionSubmitBtn"
              type="submit"
              class="rounded-md bg-indigo-600 px-5 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700"
            >
              Save Action
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
