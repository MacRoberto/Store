<div class="h-full flex flex-col items-center py-10">
  <div class="w-full max-w-4xl bg-white shadow-md rounded-lg overflow-hidden">
    <div class="px-6 py-4 bg-indigo-600 border-b border-gray-200 flex items-center justify-between">
      <h2 class="text-xl font-bold text-white">Add / Edit Permission</h2>

      <button id="goback" class="text-white font-semibold hover:text-gray-200">
        Go Back
      </button>
    </div>

    <form id="itemForm" class="p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Role</label>
        <select id="id_role" name="id_role" class="border border-gray-300 rounded-md px-3 py-2 w-full bg-white">
          <option value="">Select role</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Action</label>
        <select id="id_action" name="id_action" class="border border-gray-300 rounded-md px-3 py-2 w-full bg-white">
          <option value="">Select action</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Status</label>
        <select id="status" name="status" class="border border-gray-300 rounded-md px-3 py-2 w-full bg-white">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="flex items-center gap-3">
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
