<div class="h-full flex flex-col items-center py-10 px-4 gap-6">
  <div class="w-full max-w-6xl bg-white shadow-md rounded-lg overflow-hidden">
    <section
      class="px-6 py-5 bg-indigo-600 border-b border-gray-200 rounded-t-xl flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"
    >
      <div class="min-w-0">
        <h1 class="text-xl font-bold text-white">Assign Permissions</h1>
      </div>

      <div
        class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-center gap-3"
      >
        <button
          id="btnBackToRoles"
          type="button"
          class="px-4 py-2 border border-white/40 text-white font-medium text-sm rounded-md shadow-sm hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-white/70 focus:ring-offset-2 focus:ring-offset-indigo-600"
        >
          <i class="fa-solid fa-arrow-left text-xs mr-2"></i>
          Back to Roles
        </button>

        <button
          id="btnSavePermissions"
          type="button"
          class="px-5 py-2 bg-white text-indigo-700 font-medium text-sm rounded-md shadow-sm hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-indigo-600"
        >
          <i class="fa-solid fa-floppy-disk text-xs mr-2"></i>
          Save Permissions
        </button>
      </div>
    </section>

    <section class="p-6 bg-gray-50">
      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-6"
        id="contentPermissions"
      ></div>
    </section>
  </div>
</div>
