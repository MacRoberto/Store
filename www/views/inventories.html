<div class="h-full flex flex-col items-center py-10">
  <div class="w-full max-w-6xl bg-white shadow-md rounded-lg overflow-hidden">
    <div
      class="px-6 py-4 bg-indigo-600 border-b border-gray-200 flex items-center justify-between rounded-t-xl"
    >
      <h2 class="text-xl font-bold text-white">Inventories</h2>

      <div class="flex items-center gap-4">
        <button id="btnAdd" class="block">
          <a
            href="#"
            class="text-white font-semibold hover:text-gray-200 block"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </a>
        </button>
      </div>
    </div>

    <div
      class="px-6 py-4 border-b border-gray-200 flex flex-wrap items-end justify-between gap-4"
    >
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Search by
          </label>

          <select
            id="searchField"
            class="border border-gray-300 rounded-md px-3 py-2 bg-white"
          >
            <option value="all">All</option>
            <option value="id_inv">ID</option>
            <option value="arrival_date">Entry Date</option>
            <option value="username">Username</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Search
          </label>

          <input
            id="searchInput"
            type="text"
            placeholder="Type and press Enter..."
            class="border border-gray-300 rounded-md px-3 py-2 w-72"
          />
        </div>

        <button
          id="btnSearch"
          class="border border-indigo-500 text-indigo-600 font-medium rounded-md px-4 py-2 hover:bg-indigo-50"
        >
          Apply
        </button>
      </div>

      <div class="flex items-end gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Sort by
          </label>

          <select
            id="orderBy"
            class="border border-gray-300 rounded-md px-3 py-2 bg-white"
          >
            <option value="id_inv">ID</option>
            <option value="arrival_date">Entry Date</option>
            <option value="username">Username</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Direction
          </label>

          <select
            id="orderDirection"
            class="border border-gray-300 rounded-md px-3 py-2 bg-white"
          >
            <option value="DESC">Descending</option>
            <option value="ASC">Ascending</option>
          </select>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              ID
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Entry Date
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Username
            </th>
          </tr>
        </thead>
        <tbody
          id="inventoriesTableBody"
          class="bg-white divide-y divide-gray-200"
        ></tbody>
      </table>

      <div
        class="px-6 py-4 border-t border-gray-200 flex flex-wrap items-center justify-between gap-4"
      >
        <div id="paginationSummary" class="text-sm text-gray-600">
          Showing 0 to 0 of 0 categories
        </div>

        <div class="flex items-center gap-4">
          <button
            id="btnPrevious"
            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Previous
          </button>

          <div class="flex items-center gap-2 text-sm text-gray-600">
            <span>Page</span>

            <span
              id="currentPage"
              class="px-4 py-2 border border-gray-300 rounded-md bg-white text-gray-800"
            >
              1
            </span>

            <span>of</span>

            <span id="totalPages">1</span>
          </div>

          <button
            id="btnNext"
            class="px-4 py-2 border border-indigo-500 rounded-md text-indigo-600 hover:bg-indigo-50 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
